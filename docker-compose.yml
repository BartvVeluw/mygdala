# One local installation of Mygdala.
#
# Every clone of this repository is an installation of its own, and Docker
# Compose keeps them apart by the project name: the name of the directory this
# file sits in. A clone in ./mygdala-test gets containers named
# mygdala-test-php-1, a volume named mygdala-test_mysql_data and a network of
# its own, so it can never reach another clone's database or uploads. That is
# why no service below sets container_name: a fixed name exists only once per
# machine, and the second installation would refuse to start. Two clones in
# directories with the same name are the one case that needs
# COMPOSE_PROJECT_NAME in .env.
#
# Run commands from this directory and address a service, not a container:
#   docker compose exec php php vendor/bin/phinx status
#
# The only host ports are the three a person opens in a browser, and each is a
# variable in .env: APP_PORT, ADMINER_PORT and MAILPIT_WEB_PORT. See README.md.
services:
  # PHP + Apache, with Composer and Phinx available inside the container.
  # On startup it installs Composer packages (first run only) and runs
  # pending Phinx migrations automatically, then serves the site.
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      # Inside the Docker network, MySQL and Mailpit are reachable by their
      # service name on their own port, never on 127.0.0.1 or on whatever .env
      # names for a server without Docker. Pinned here so no value in .env can
      # point a container somewhere else.
      DB_HOST: mysql
      DB_PORT: "3306"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    volumes:
      - ./:/var/www/html
      # Contact-request attachments live outside the webroot (/var/www/html)
      # — see src/Service/ContactAttachmentStorage.php. A named volume (not
      # a bind mount) so it isn't wiped by a plain container recreation.
      - contact_attachments:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The same site, served against the TEST database instead of the
  # development one, so the HTTP-level tests can create pages, blocks and
  # orders without an editor ever seeing them. Behind a Compose profile, so
  # a plain `docker compose up -d` does not start it:
  #   docker compose --profile test up -d
  # See TESTING.md.
  php_test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["test"]
    restart: unless-stopped
    # No fixed host port. The HTTP tier reaches this container as
    # http://php_test inside the Docker network. Docker publishes it on a free
    # port of its own choosing, so it can still be opened by hand
    # (`docker compose port php_test 80` says which) and two installations
    # running their test profile never ask for the same one.
    ports:
      - "80"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # Overrides .env — this container must never open the development
      # database. Its entrypoint runs the migrations against this one.
      DB_DATABASE: ${TEST_DB_DATABASE:-mygdala_tests}
      TEST_DB_DATABASE: ${TEST_DB_DATABASE:-mygdala_tests}
      # The Blog is the one module that defaults to OFF (BLOG.md), so the
      # container the HTTP tier shoots at has to ask for it explicitly —
      # otherwise every /blog test would be testing a 404. This is the same
      # deployment switch a site owner uses, not a test-only mechanism.
      MODULE_BLOG_ENABLED: "true"
    volumes:
      - ./:/var/www/html
      - test_attachments:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The same site AND the same test database, but with the Shop (and with it
  # Personalisatie) switched off — the CMS-only deployment, so the module
  # boundary can be proven over real HTTP instead of only in-process.
  #
  # It is a separate container rather than a setting the suite flips because
  # MODULE_* is deployment configuration read from the environment: a test
  # cannot change what an already-running web server was started with, and
  # writing a config file would change the development site too (both mount
  # this same directory). Same compose profile as php_test:
  #   docker compose --profile test up -d
  # See TESTING.md.
  php_cms:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["test"]
    restart: unless-stopped
    # A free host port, for the same reason as php_test:
    # `docker compose port php_cms 80`.
    ports:
      - "80"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      DB_DATABASE: ${TEST_DB_DATABASE:-mygdala_tests}
      TEST_DB_DATABASE: ${TEST_DB_DATABASE:-mygdala_tests}
      # The whole point of this container. Personalisatie depends on the Shop,
      # so App\Module\ModuleRegistry switches it off with it; it is named here
      # as well so the configuration says out loud what is running.
      MODULE_SHOP_ENABLED: "false"
      MODULE_PERSONALIZATION_ENABLED: "false"
      # The Blog is off here as well, and it is off by simply not being asked
      # for — this container is what proves a disabled module's public URLs
      # answer 404 over real HTTP.
      MODULE_BLOG_ENABLED: "false"
    volumes:
      - ./:/var/www/html
      - cms_attachments:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # No host port. The PHP containers reach MySQL as mysql:3306 over the Docker
  # network, and Adminer below is the way in for a person. A published 3306
  # is also exactly what would stop a second installation from starting.
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web-based database viewer, so you can browse tables/rows without any MySQL knowledge.
  # Open http://localhost:<ADMINER_PORT> (8080 unless .env says otherwise) after
  # `docker compose up -d`, log in with the DB_* values from .env and
  # Server: mysql (the service name above, not localhost).
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - mysql

  # Local mail testing: catches all outgoing mail instead of sending it for real.
  # Web UI to read caught mail: http://localhost:<MAILPIT_WEB_PORT> (8025 unless
  # .env says otherwise). The site delivers to mailpit:1025 inside the Docker
  # network, so the SMTP port is not published on the host.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"

# Compose prefixes each volume with the project name: the checkout in
# ./mygdala keeps its database in mygdala_mysql_data. Renaming a key here
# would leave every installation's existing volume behind and start it on an
# empty database, so these four names stay as they are.
volumes:
  mysql_data:
  contact_attachments:
  test_attachments:
  cms_attachments:
